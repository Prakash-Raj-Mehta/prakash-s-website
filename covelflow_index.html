<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prakash' portfolio</title>
    <link href="coverflow_assets/templatemo-3d-coverflow.css" rel="stylesheet">
<!--

TemplateMo 595 3d coverflow

https://templatemo.com/tm-595-3d-coverflow

-->
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <a href="index.html" class="logo-container">
            <div class="logo">
                <svg viewBox="0 0 100 100" xmlns="index.html">
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#cd0011;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#60249d;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect x="10" y="25" width="15" height="50" fill="url(#grad1)" transform="rotate(-20 20 45)" />
                    <rect x="35" y="15" width="15" height="50" fill="url(#grad1)" transform ="rotate(0 0 0)"/>
                    <rect x="60" y="25" width="15" height="50" fill="url(#grad1)" transform="rotate(20 -20 -45)" />
                    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.5" />
                </svg>
            </div>
            <div class="logo-text">Hi there! Welcome to My Portfolio</div>
        </a>
        
        <nav class="main-menu" id="mainMenu">
            
        </nav>
        
        <div class="menu-toggle" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <!-- Home Section -->
    <section id="home" class="section">
        <div class="coverflow-wrapper">
            <div class="info">
                <h2 id="current-title">cooming</h2>
                <p id="current-description">just cooming</p>
            </div>

            <div class="coverflow-container" tabindex="0">
                <div class="coverflow" id="coverflow">
                    <div class="coverflow-item" data-index="0">
                        <div class="cover image-loading">
                            <img src="coverflow_assets/img/oneimg.HEIC" alt="Mountain Landscape" loading="lazy">
                        </div>
                        <div class="reflection"></div>
                    </div>
                    <div class="coverflow-item" data-index="1">
                        <div class="cover image-loading">
                            <img src="coverflow_assets/img/img.png" alt="Forest Path" loading="lazy">
                        </div>
                        <div class="reflection"></div>
                    </div>
                    <div class="coverflow-item" data-index="2">
                        <div class="cover image-loading">
                            <img src="coverflow_assets/img/img.png" alt="Lake Reflection" loading="lazy">
                        </div>
                        <div class="reflection"></div>
                    </div>
                    <div class="coverflow-item" data-index="3">
                        <div class="cover image-loading">
                            <img src="coverflow_assets/img/img.png" alt="Ocean Sunset" loading="lazy">
                        </div>
                        <div class="reflection"></div>
                    </div>
                    <div class="coverflow-item" data-index="4">
                        <div class="cover image-loading">
                            <img src="coverflow_assets/img/img.png" alt="Desert Dunes" loading="lazy">
                        </div>
                        <div class="reflection"></div>
                    </div>
                    <div class="coverflow-item" data-index="5">
                        <div class="cover image-loading">
                            <img src="coverflow_assets/img/img.png" alt="Starry Night" loading="lazy">
                        </div>
                        <div class="reflection"></div>
                    </div>
                    <div class="coverflow-item" data-index="6">
                        <div class="cover image-loading">
                            <img src="coverflow_assets/img/img.png" alt="Waterfall" loading="lazy">
                        </div>
                        <div class="reflection"></div>
                    </div>
                </div>

                <button class="nav-button prev" onclick="navigate(-1)">‹</button>
                <button class="nav-button next" onclick="navigate(1)">›</button>

                <div class="dots-container" id="dots"></div>
                
                <!-- Play/Pause Button -->
                <button class="play-pause-button" id="playPauseBtn" onclick="toggleAutoplay()">
                    <span class="play-icon">▶</span>
                    <span class="pause-icon" style="display: none;">❚❚</span>
                </button>
            </div>
        </div>
    </section>

    <!-- About Section -->
    

    <!-- Contact Section -->
    

    <!-- Footer -->
    

    <!-- Scroll to top button -->
    <div class="scroll-to-top" id="scrollToTop">
        <span>↑</span>
    </div>

<script src="coverflow_assets/templatemo-3d-coverflow-scripts.js"></script>

</body>
</html>
